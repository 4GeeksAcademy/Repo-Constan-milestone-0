    <line x1="110" y1="330" x2="530" y2="330"/>
    <g stroke-width="4" stroke-opacity=".7">
      <line x1="150" y1="322" x2="150" y2="338"/><line x1="210" y1="322" x2="210" y2="338"/>
      <line x1="270" y1="322" x2="270" y2="338"/><line x1="330" y1="322" x2="330" y2="338"/>
      <line x1="390" y1="322" x2="390" y2="338"/><line x1="450" y1="322" x2="450" y2="338"/>
      <line x1="500" y1="322" x2="500" y2="338"/>
    </g>
  </g>
  <!-- cortes -->
  <g>
    <rect x="160" y="282" width="130" height="44" rx="20" fill="url(#meat)"/>
    <g stroke="#2a1208" stroke-width="5" stroke-linecap="round" opacity=".8">
      <line x1="185" y1="290" x2="205" y2="318"/><line x1="215" y1="290" x2="235" y2="318"/><line x1="245" y1="290" x2="265" y2="318"/>
    </g>
    <rect x="320" y="286" width="150" height="40" rx="18" fill="url(#meat)"/>
    <g stroke="#2a1208" stroke-width="5" stroke-linecap="round" opacity=".8">
      <line x1="345" y1="293" x2="365" y2="319"/><line x1="380" y1="293" x2="400" y2="319"/><line x1="415" y1="293" x2="435" y2="319"/>
    </g>
  </g>
  <!-- brasas -->
  <g>
    <ellipse cx="320" cy="420" rx="250" ry="30" fill="#2a221c"/>
    <g fill="#ff8a3d">
      <circle cx="170" cy="415" r="9"/><circle cx="220" cy="425" r="7"/><circle cx="280" cy="412" r="10"/>
      <circle cx="340" cy="424" r="8"/><circle cx="400" cy="414" r="9"/><circle cx="460" cy="424" r="7"/>
    </g>
    <g fill="#e8b04b"><circle cx="250" cy="418" r="4"/><circle cx="370" cy="418" r="4"/><circle cx="430" cy="410" r="3"/></g>
  </g>
