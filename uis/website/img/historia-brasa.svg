<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t">
  <title id="t">Parrilla de carbón con cortes de carne dorándose sobre las brasas</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="78%" r="60%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#d4520c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1c1612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a221c"/>
      <stop offset="1" stop-color="#120e0b"/>
    </linearGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3b1c"/>
      <stop offset="1" stop-color="#5a2412"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)"/>
  <!-- humo -->
  <g fill="none" stroke="#e9e4dd" stroke-opacity=".12" stroke-width="10" stroke-linecap="round">
    <path d="M220 200c-20-40 30-60 10-100s20-60 10-80"/>
    <path d="M330 190c-20-40 30-60 10-100s20-60 10-80"/>
    <path d="M440 200c-20-40 30-60 10-100s20-60 10-80"/>
  </g>
  <!-- llamas -->
  <g>
    <path d="M150 380c10-40 40-50 30-90 30 25 40 55 30 90z" fill="#d4520c"/>
    <path d="M250 385c5-50 45-60 35-110 35 35 45 70 30 110z" fill="#f26a1b"/>
    <path d="M360 385c10-45 40-60 30-100 35 30 45 65 30 100z" fill="#d4520c"/>
    <path d="M450 380c8-38 38-48 28-85 30 25 38 55 28 85z" fill="#f26a1b"/>
    <path d="M200 390c5-30 25-35 20-60 22 20 26 40 20 60z" fill="#e8b04b"/>
    <path d="M310 390c5-34 28-40 22-68 25 22 30 46 22 68z" fill="#e8b04b"/>
    <path d="M410 390c5-30 25-35 20-60 22 20 26 40 20 60z" fill="#e8b04b"/>
  </g>
